name: Deploy to Vercel
on:
  push:
    branches:
      - main
  # opcional: habilita deploy manual na UI
  # workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # usar npx evita instalar globalmente
          npx vercel --prod --confirm --token $VERCEL_TOKEN
