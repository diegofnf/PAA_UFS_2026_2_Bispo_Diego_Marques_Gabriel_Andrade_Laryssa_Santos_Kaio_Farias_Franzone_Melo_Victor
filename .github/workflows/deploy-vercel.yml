name: Deploy to Vercel
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'  # ← Alterado de 18.x para 20.x

      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json yarn.lock || true
          npm cache clean --force
          npm install

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel --prod --confirm --token $VERCEL_TOKEN
